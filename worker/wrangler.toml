name = "kalidass-journal-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.kalidass.amrit.fyi/*", zone_name = "amrit.fyi" }
]

[vars]
CORS_ORIGIN = "https://kalidass.amrit.fyi"
ROOT_BUCKET = "kalidass"
CLEF_MODEL = "clef-flash"
EVAL_PROVIDER = "jev"
# AUTH0_DOMAIN, AUTH0_AUDIENCE, ADMIN_EMAILS, TYPESAFE_API_KEY, CLEF_API_KEY, and CLOUDFLARE_ACCOUNT_ID
# are configured via wrangler secret / .dev.vars

